[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iterated-prisoners-dilemma"
version = "0.1.0"
description = "Iterated Prisoner's Dilemma: game theory analysis and tournament simulation"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["ipd*"]
